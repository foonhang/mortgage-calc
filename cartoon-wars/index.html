<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>卡通戰爭 · 原型 v1.3.1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    height: 100dvh;
    background: #1a1520;
    color: #fff;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding-top: env(safe-area-inset-top, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: #2a2235;
    gap: 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .stat {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .stat span { color: #ffd54a; }
  .gold-icon {
    width: 22px;
    height: 22px;
    object-fit: contain;
    flex-shrink: 0;
    display: block;
  }
  .stat-meta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .streak-badge-wrap {
    position: relative;
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: none;
  }
  .streak-badge-wrap.show { display: inline-block; }
  .streak-badge-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .streak-badge-wrap .streak-num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    color: #ffd54a;
    text-shadow: 0 1px 2px #000;
    pointer-events: none;
    line-height: 1;
  }
  #hpBar {
    flex: 1;
    display: flex;
    gap: 6px;
    align-items: center;
    min-width: 120px;
  }
  .hp {
    flex: 1;
    height: 14px;
    background: #3a3045;
    border-radius: 7px;
    overflow: hidden;
    position: relative;
  }
  .hp > i {
    display: block;
    height: 100%;
    width: 100%;
    transform-origin: left center;
    transition: transform 0.2s;
  }
  #pHp > i { background: linear-gradient(90deg, #4caf50, #8bc34a); }
  #eHp > i { background: linear-gradient(90deg, #ef5350, #ff7043); transform-origin: right center; }
  .hp-label { font-size: 11px; opacity: 0.85; min-width: 28px; }
  .hud-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .hud-btn {
    border: none;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    min-height: 40px;
    touch-action: manipulation;
    white-space: nowrap;
    background: #4a3f5c;
  }
  .hud-btn:active { transform: translateY(1px); }
  .hud-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  #btnGoldBoost { background: #c9a227; color: #1a1520; }
  #btnMute.on { background: #666; }
  #stageWrap {
    flex: 1;
    position: relative;
    min-height: 0;
    background: linear-gradient(180deg, #87ceeb 0%, #87ceeb 55%, #6bbf5a 55%, #5aad4a 100%);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr) auto;
    gap: 8px;
    padding: 12px 12px calc(14px + env(safe-area-inset-bottom, 0px));
    background: #2a2235;
    flex-shrink: 0;
  }
  button.unit {
    border: none;
    border-radius: 14px;
    padding: 8px 4px 10px;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    min-height: 72px;
    line-height: 1.15;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    touch-action: manipulation;
  }
  button.unit:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
  button.unit:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .unit-icon {
    display: block;
    width: 36px;
    height: 36px;
    font-size: 26px;
    line-height: 36px;
    text-align: center;
    object-fit: contain;
    pointer-events: none;
  }
  .unit-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .unit-name { font-size: 13px; font-weight: 800; }
  #btnSword { background: #3d7ea6; }
  #btnArcher { background: #6a8f3d; }
  #btnGiant { background: #a65c3d; }
  #btnBomber { background: #7b4aa6; }
  #btnRestart {
    background: #555;
    border: none;
    border-radius: 14px;
    padding: 12px 12px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    min-height: 72px;
    white-space: nowrap;
    touch-action: manipulation;
  }
  #btnRestart:active { transform: translateY(2px); }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.72);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    z-index: 5;
    padding: 24px;
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay.win #endTitle { color: #81c784; }
  #overlay.lose #endTitle { color: #ef9a9a; }
  #overlay h1 {
    font-size: clamp(32px, 8vw, 44px);
    text-shadow: 0 2px 12px #000;
    font-weight: 900;
  }
  #endSub {
    font-size: 15px;
    opacity: 0.9;
    max-width: 300px;
    line-height: 1.45;
  }
  #endCard {
    position: relative;
    width: min(900px, 94vw);
    max-width: 900px;
    aspect-ratio: 900 / 520;
    background-color: #1a1520;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    border: none;
    border-radius: 18px;
    padding: 0;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  #overlay.win #endCard { background-image: var(--end-win); }
  #overlay.lose #endCard { background-image: var(--end-lose); }
  #endCard .end-title-vis {
    position: absolute;
    left: 0; right: 0;
    top: 8.5%;
    height: 16%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #endCard #endTitle {
    font-size: clamp(22px, 5.5vw, 40px);
    opacity: 0;
    height: 0;
    margin: 0;
    overflow: hidden;
  }
  #endCard #endSub {
    display: none;
  }
  #endBody {
    position: absolute;
    left: 10%;
    right: 10%;
    top: 29%;
    height: 28%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(10, 8, 16, 0.55);
    border-radius: 12px;
    padding: 8px 12px;
    text-align: center;
  }
  #endStats {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin: 0;
    font-size: clamp(13px, 2.8vw, 18px);
    font-weight: 800;
  }
  #endStats span { color: #ffd54a; }
  #endRecord {
    font-size: clamp(12px, 2.4vw, 15px);
    opacity: 0.95;
    margin: 0;
    font-weight: 700;
  }
  #endTip {
    font-size: clamp(10px, 2vw, 12px);
    opacity: 0.8;
    line-height: 1.35;
    margin: 2px 0 0;
    max-width: 100%;
  }
  #endCard #btnAgain {
    position: absolute;
    left: 17.8%;
    width: 64.4%;
    top: 63.5%;
    height: 26.5%;
    margin: 0;
    min-height: 0;
    min-width: 0;
    max-width: none;
    padding: 0;
    border-radius: 14px;
    font-size: clamp(18px, 4.5vw, 28px);
    background: transparent;
    color: transparent;
    box-shadow: none;
    border: none;
    cursor: pointer;
  }
  #endCard #btnAgain:active { transform: scale(0.98); box-shadow: none; }
  #overlay button#btnAgain { /* keep touch */ touch-action: manipulation; }
  #matchTip {
    font-size: 11px;
    opacity: 0.72;
    text-align: center;
    padding: 4px 10px 0;
    background: #2a2235;
    flex-shrink: 0;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }
  .stat-meta {
    font-size: 12px;
    font-weight: 700;
    opacity: 0.9;
    white-space: nowrap;
  }
  .stat-meta span { color: #ffd54a; }
  #overlay button:not(#btnAgain) {
    background: #ffd54a;
    color: #1a1520;
    border: none;
    border-radius: 18px;
    padding: 18px 40px;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    min-height: 72px;
    min-width: min(280px, 86vw);
    width: 100%;
    max-width: 300px;
    margin-top: 14px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.35);
    touch-action: manipulation;
  }
  #overlay button:not(#btnAgain):active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
  .cost { display: block; font-size: 12px; font-weight: 600; opacity: 0.95; margin-top: 2px; }
  #cdHint {
    font-size: 11px;
    opacity: 0.7;
    text-align: center;
    grid-column: 1 / -1;
    margin-top: -4px;
    min-height: 14px;
  }
  @media (orientation: landscape) and (max-height: 500px) {
    #hud { padding: 4px 8px; }
    .hud-btn { min-height: 36px; padding: 6px 8px; font-size: 11px; }
    #controls {
      gap: 6px;
      padding: 6px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    }
    button.unit, #btnRestart { min-height: 60px; padding: 4px 2px; }
    .unit-icon { width: 26px; height: 26px; font-size: 20px; line-height: 26px; }
    .unit-name { font-size: 12px; }
    .cost { font-size: 11px; }
  }
  /* 窄屏：出兵掣兩行 2×2，重開另列，避免重疊／撳唔到 */
  @media (max-width: 420px) {
    #controls {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 10px 10px calc(12px + env(safe-area-inset-bottom, 0px));
    }
    button.unit {
      min-height: 68px;
      padding: 6px 2px 8px;
    }
    .unit-icon { width: 32px; height: 32px; font-size: 22px; line-height: 32px; }
    .unit-name { font-size: 12px; }
    .cost { font-size: 11px; }
    #btnRestart {
      grid-column: 1 / -1;
      min-height: 48px;
      padding: 10px 8px;
      font-size: 14px;
    }
    #cdHint { grid-column: 1 / -1; }
  }
  @media (max-width: 360px) {
    .unit-name { font-size: 11px; }
    .cost { font-size: 10px; }
    button.unit { min-height: 64px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat"><img class="gold-icon" id="goldIcon" alt="" width="22" height="22" /><span id="gold">0</span></div>
    <div class="stat-meta" title="連勝／總勝場">
      <span class="streak-badge-wrap" id="streakBadgeWrap" aria-hidden="true">
        <img id="streakBadgeImg" alt="" width="36" height="36" />
        <span class="streak-num" id="streakBadgeNum">0</span>
      </span>
      連<span id="streakHud">0</span> · 勝<span id="winsHud">0</span>
    </div>
    <div id="hpBar">
      <span class="hp-label">我方</span>
      <div class="hp" id="pHp"><i id="pHpFill"></i></div>
      <div class="hp" id="eHp"><i id="eHpFill"></i></div>
      <span class="hp-label">敵方</span>
    </div>
    <div class="hud-actions">
      <button type="button" class="hud-btn" id="btnGoldBoost" title="永久 +30% 產金">加速產金 · 200</button>
      <button type="button" class="hud-btn" id="btnMute" title="音效開關">音效開</button>
    </div>
  </div>
  <div id="matchTip">劍壓弓 · 弓風箏巨人 · 炸彈清堆 · 巨人抗劍</div>
  <div id="stageWrap">
    <canvas id="c"></canvas>
    <div id="overlay">
      <div id="endCard">
        <h1 id="endTitle"></h1>
        <p id="endSub"></p>
        <div id="endBody">
          <div id="endStats">擊殺 <span id="endKills">0</span> · 用時 <span id="endTime">0:00</span></div>
          <div id="endRecord">連勝 <span id="endStreak">0</span> · 總勝 <span id="endWins">0</span></div>
          <p id="endTip">劍壓弓 · 弓風箏巨人 · 炸彈清堆 · 巨人抗劍</p>
        </div>
        <button type="button" id="btnAgain" aria-label="再開一局">再開</button>
      </div>
    </div>
  </div>
  <div id="controls">
    <button type="button" class="unit" id="btnSword" data-unit="sword" data-icon="sword">
      <span class="unit-icon" aria-hidden="true">⚔️</span>
      <span class="unit-name">劍士</span>
      <span class="cost" id="costSword"></span>
    </button>
    <button type="button" class="unit" id="btnArcher" data-unit="archer" data-icon="archer">
      <span class="unit-icon" aria-hidden="true">🏹</span>
      <span class="unit-name">弓箭手</span>
      <span class="cost" id="costArcher"></span>
    </button>
    <button type="button" class="unit" id="btnGiant" data-unit="giant" data-icon="giant">
      <span class="unit-icon" aria-hidden="true">💪</span>
      <span class="unit-name">巨人</span>
      <span class="cost" id="costGiant"></span>
    </button>
    <button type="button" class="unit" id="btnBomber" data-unit="bomber" data-icon="bomber">
      <span class="unit-icon" aria-hidden="true">💣</span>
      <span class="unit-name">炸彈兵</span>
      <span class="cost" id="costBomber"></span>
    </button>
    <button type="button" id="btnRestart">重開</button>
    <div id="cdHint"></div>
  </div>
</div>

  const SFX = {
    enabled: (function () {
      try { return localStorage.getItem('cw_sfx_mute') !== '1'; } catch (e) { return true; }
    })(),
    ctx: null,
    ensure: function () {
      if (!this.ctx) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        } catch (e) {}
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        try { this.ctx.resume(); } catch (e) {}
      }
    },
    play: function (kind) {
      if (!this.enabled) return;
      this.ensure();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.connect(g);
      g.connect(this.ctx.destination);
      let freq = 440, dur = 0.08, type = 'square', vol = 0.04;
      if (kind === 'spawn') { freq = 520; dur = 0.06; type = 'triangle'; }
      else if (kind === 'hit') { freq = 180; dur = 0.05; type = 'square'; vol = 0.035; }
      else if (kind === 'win') { freq = 660; dur = 0.22; type = 'sine'; vol = 0.05; }
      else if (kind === 'lose') { freq = 140; dur = 0.28; type = 'sawtooth'; vol = 0.04; }
      else if (kind === 'boom') { freq = 90; dur = 0.18; type = 'sawtooth'; vol = 0.06; }
      o.type = type;
      o.frequency.setValueAtTime(freq, now);
      if (kind === 'win') o.frequency.exponentialRampToValueAtTime(880, now + dur);
      if (kind === 'lose' || kind === 'boom') o.frequency.exponentialRampToValueAtTime(50, now + dur);
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.start(now);
      o.stop(now + dur + 0.02);
    },
    setMuted: function (muted) {
      this.enabled = !muted;
      try { localStorage.setItem('cw_sfx_mute', muted ? '1' : '0'); } catch (e) {}
    }
  };

  function grantBounty(victimType, killerSide) {
    const b = KILL_BOUNTY[victimType] || 0;
    if (b <= 0) return;
    // 玩家擊殺／自爆殺敵 → 金幣；敵 AI 無金幣經濟，只記表（對稱預留）

  }

  function applyHitFeedback(target, fromX) {
    target.flash = FLASH_TIME;
    const dir = target.x >= fromX ? 1 : -1;
    target.x += dir * KNOCKBACK;
  }

  function killUnit(u, killerSide) {
    if (!u.alive) return;
    u.alive = false;
    if (killerSide === 'p') killCount += 1;
    grantBounty(u.type, killerSide);
  }

  function damageUnit(u, dmg, fromX, attackerSide) {
    if (!u.alive) return;
    u.hp -= dmg;
    applyHitFeedback(u, fromX);
    SFX.play('hit');
    if (u.hp <= 0) killUnit(u, attackerSide);
  }

  function explodeBomber(u) {
    const def = UNIT_DEFS.bomber;
    const r = def.explodeRadius;
    const dmg = def.explodeDmg;
    fx.push({ x: u.x, y: u.y - def.height * 0.4, life: 0.35, r: r });
    SFX.play('boom');
    // 自爆殺敵：跟 KILL_BOUNTY 畀對應側賞金；自爆本身唔畀「自殺賞」
    for (let i = 0; i < units.length; i++) {
      const o = units[i];
      if (!o.alive || o === u || o.side === u.side) continue;
      if (Math.abs(o.x - u.x) <= r) {
        o.hp -= dmg;
        applyHitFeedback(o, u.x);
        if (o.hp <= 0) {
          o.alive = false;
          if (u.side === 'p') killCount += 1;
          grantBounty(o.type, u.side);
        } else {
          SFX.play('hit');
        }
      }
    }
    // 近城堡時也轟城堡
    const enemyCastleX = castleX(u.side === 'p' ? 'e' : 'p');
    if (Math.abs(u.x - enemyCastleX) < r + 20) {
      if (u.side === 'p') eCastle = Math.max(0, eCastle - Math.floor(dmg * 0.45));
      else pCastle = Math.max(0, pCastle - Math.floor(dmg * 0.45));
      updateHud();
    }
    u.alive = false; // 自爆唔攞自殺賞金
  }

  function countNearSpawn(side, x, radius) {
    let n = 0;
    for (let i = 0; i < units.length; i++) {
      const u = units[i];
      if (!u.alive || u.side !== side) continue;
      if (Math.abs(u.x - x) < radius) n++;
    }
    return n;
  }

  function spawn(type, side) {
    const def = UNIT_DEFS[type];
    const dir = side === 'p' ? 1 : -1;
    let x = castleX(side) + dir * 36;
    const crowd = countNearSpawn(side, x, def.radius * 2.5);
    if (crowd > 0) {
      x += dir * (12 + crowd * 10);
    }
    units.push({
      type: type,
      side: side,
      x: x,
      y: groundY,
      hp: def.hp,
      maxHp: def.hp,
      cd: 0,
      atkCd: 0,
      alive: true,
      flash: 0,
      skin: def.skin,
      spriteKey: def.spriteKey
    });
  }

  function trySpawn(type) {

    if (!running || gold < def.cost || spawnCd > 0) return;
    gold -= def.cost;

    spawn(type, 'p');
    SFX.play('spawn');
    updateHud();

  function tryBuyGoldBoost() {

  function aiPhase() {
    // 前 / 中 / 後 三段
    if (gameTime < 45) return 'early';
    if (gameTime < 100) return 'mid';
    return 'late';
  }

  function enemyAi(dt) {
    enemyTimer -= dt;
    if (enemyTimer > 0) return;
    const phase = aiPhase();
    let minI, maxI;
    if (phase === 'early') { minI = 2.4; maxI = 4.2; }
    else if (phase === 'mid') { minI = 1.7; maxI = 3.2; }
    // late：略放慢，純劍＋弓＋產金升級仍有機會贏
    else { minI = 1.4; maxI = 2.65; }
    enemyTimer = minI + Math.random() * (maxI - minI);

    const roll = Math.random();
    let type = 'sword';
    if (phase === 'early') {
      if (roll < 0.55) type = 'sword';
      else if (roll < 0.88) type = 'archer';
      else type = 'giant';
    } else if (phase === 'mid') {
      if (roll < 0.35) type = 'sword';
      else if (roll < 0.62) type = 'archer';
      else if (roll < 0.88) type = 'giant';
      else type = 'bomber';
    } else {
      // late：降 giant／bomber 權重（約 28%／18%，前為 30%／28%）
      if (roll < 0.30) type = 'sword';
      else if (roll < 0.54) type = 'archer';
      else if (roll < 0.82) type = 'giant';
      else type = 'bomber';
    }
    // 血低時偏貴兵（略降機率同 bomber 比例）
    if (eCastle < CASTLE_MAX * 0.4 && Math.random() < 0.25) {
      type = Math.random() < 0.68 ? 'giant' : 'bomber';
    }
    const pCount = units.filter(function (u) { return u.side === 'p' && u.alive; }).length;
    if (pCount >= 4) enemyTimer *= 0.85;
    spawn(type, 'e');
  }

  function findTarget(u) {
    let best = null;
    let bestDist = Infinity;
    const dir = u.side === 'p' ? 1 : -1;
    for (let i = 0; i < units.length; i++) {
      const o = units[i];
      if (!o.alive || o.side === u.side) continue;
      const dx = (o.x - u.x) * dir;
      if (dx < -10) continue;
      const dist = Math.abs(o.x - u.x);
      if (dist < bestDist) {
        bestDist = dist;
        best = o;
      }
    }
    return { target: best, dist: bestDist };
  }

  function separateAllies() {
    for (let i = 0; i < units.length; i++) {
      const a = units[i];
      if (!a.alive) continue;
      const ra = UNIT_DEFS[a.type].radius;
      for (let j = i + 1; j < units.length; j++) {
        const b = units[j];
        if (!b.alive || b.side !== a.side) continue;
        const rb = UNIT_DEFS[b.type].radius;
        const minDist = (ra + rb) * SEPARATION_FACTOR;
        const dx = b.x - a.x;
        const dist = Math.abs(dx);
        if (dist >= minDist || dist < 0.001) {
          if (dist < 0.001) {
            const push = (minDist * 0.5);
            const dir = a.side === 'p' ? 1 : -1;
            a.x -= dir * push * 0.5;
            b.x += dir * push * 0.5;
          }
          continue;
        }
        const overlap = minDist - dist;
        const push = overlap * 0.5;
        if (dx > 0) {
          a.x -= push;
          b.x += push;
        } else {
          a.x += push;
          b.x -= push;
        }
      }
    }
  }

  function updateUnits(dt) {
    for (let i = 0; i < units.length; i++) {
      const u = units[i];
      if (!u.alive) continue;
      const def = UNIT_DEFS[u.type];
      const dir = u.side === 'p' ? 1 : -1;
      u.atkCd = Math.max(0, u.atkCd - dt);
      if (u.flash > 0) u.flash = Math.max(0, u.flash - dt);

      const info = findTarget(u);
      const inRange = info.target && info.dist <= def.range;

      if (inRange) {
        if (u.atkCd <= 0) {
          if (u.type === 'bomber') {
            explodeBomber(u);
            continue;
          }
          u.atkCd = u.type === 'archer' ? 0.85 : (u.type === 'giant' ? 1.1 : 0.7);
          if (u.type === 'archer') {
            projectiles.push({
              x: u.x + dir * 8,
              y: u.y - def.height * 0.55,
              vx: dir * 220,
              dmg: def.dmg,
              side: u.side,
              life: 1.2
            });
          } else {
            damageUnit(info.target, def.dmg, u.x, u.side);
          }
        }
      } else {
        u.x += dir * def.speed * dt;
      }

      if (!u.alive) continue;

      const enemyCastleX = castleX(u.side === 'p' ? 'e' : 'p');
      if (Math.abs(u.x - enemyCastleX) < 40) {
        if (u.type === 'bomber') {
          explodeBomber(u);
          continue;
        }
        if (u.atkCd <= 0) {
          u.atkCd = 0.8;
          if (u.side === 'p') {
            eCastle = Math.max(0, eCastle - def.dmg);
          } else {
            pCastle = Math.max(0, pCastle - def.dmg);
          }
          SFX.play('hit');
          updateHud();
        }
        u.x = enemyCastleX - dir * 38;
      }
    }
    separateAllies();
    units = units.filter(function (u) { return u.alive; });
  }

  function updateProjectiles(dt) {
    for (let i = 0; i < projectiles.length; i++) {
      const p = projectiles[i];
      p.x += p.vx * dt;
      p.life -= dt;
      let hit = false;
      for (let j = 0; j < units.length; j++) {
        const u = units[j];
        if (!u.alive || u.side === p.side) continue;
        if (Math.abs(u.x - p.x) < UNIT_DEFS[u.type].radius + 4) {
          damageUnit(u, p.dmg, p.x, p.side);
          hit = true;
          break;
        }
      }
      if (!hit) {
        const cx = castleX(p.side === 'p' ? 'e' : 'p');
        if (Math.abs(p.x - cx) < 30) {
          if (p.side === 'p') eCastle = Math.max(0, eCastle - p.dmg);
          else pCastle = Math.max(0, pCastle - p.dmg);
          updateHud();
          hit = true;
        }
      }
      if (hit || p.life <= 0) p.life = -1;
    }
    projectiles = projectiles.filter(function (p) { return p.life > 0; });
    units = units.filter(function (u) { return u.alive; });
  }

  function updateFx(dt) {
    for (let i = 0; i < fx.length; i++) fx[i].life -= dt;
    fx = fx.filter(function (f) { return f.life > 0; });
  }

  function showEndCard(won) {

    endHandled = true;

      endSub.textContent = '我方城堡被攻破，再開一局再戰！';
      overlay.classList.remove('win');

  function checkEnd() {
    if (eCastle <= 0) {
      showEndCard(true);
      return;
    }
    if (pCastle <= 0) {
      showEndCard(false);
    }
  }

  function getUnitDrawStyle(u) {
    const def = UNIT_DEFS[u.type];
    return {
      color: u.side === 'p' ? def.color : '#ef9a9a',
      height: def.height,
      radius: def.radius,
      skin: u.skin != null ? u.skin : def.skin,
      spriteKey: u.spriteKey || def.spriteKey || u.type
    };
  }

  function drawStick(u) {
    const def = UNIT_DEFS[u.type];
    const style = getUnitDrawStyle(u);
    const x = u.x;
    const y = u.y;
    const h = style.height;
    const dir = u.side === 'p' ? 1 : -1;
    let col = style.color;
    if (u.flash > 0) col = '#ffffff';

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(dir, 1);

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, 2, style.radius * 0.9, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.35);
    ctx.lineTo(-6, 0);
    ctx.moveTo(0, -h * 0.35);
    ctx.lineTo(6, 0);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, -h * 0.35);
    ctx.lineTo(0, -h * 0.7);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, -h * 0.55);
    ctx.lineTo(10, -h * 0.45);
    ctx.moveTo(0, -h * 0.55);
    ctx.lineTo(-8, -h * 0.5);
    ctx.stroke();

    if (u.type === 'sword') {
      ctx.strokeStyle = u.flash > 0 ? '#fff' : '#eee';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(10, -h * 0.45);
      ctx.lineTo(18, -h * 0.75);
      ctx.stroke();
    } else if (u.type === 'archer') {
      ctx.strokeStyle = u.flash > 0 ? '#fff' : '#8d6e63';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(12, -h * 0.5, 8, -0.8, 0.8);
      ctx.stroke();
    } else if (u.type === 'bomber') {
      ctx.fillStyle = u.flash > 0 ? '#fff' : '#5d4037';
      ctx.beginPath();
      ctx.arc(12, -h * 0.55, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffeb3b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(12, -h * 0.55 - 7);
      ctx.lineTo(16, -h * 0.55 - 14);
      ctx.stroke();
    } else {
      ctx.fillStyle = u.flash > 0 ? '#fff' : '#6d4c41';
      ctx.fillRect(8, -h * 0.7, 6, 16);
    }

    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(0, -h * 0.82, u.type === 'giant' ? 9 : 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(2, -h * 0.84, 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    const bw = style.radius * 2.2;
    const ratio = Math.max(0, u.hp / u.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(x - bw / 2, y - h - 10, bw, 4);
    ctx.fillStyle = ratio > 0.4 ? '#66bb6a' : '#ef5350';
    ctx.fillRect(x - bw / 2, y - h - 10, bw * ratio, 4);
  }

  function drawCastle(side) {
    const x = castleX(side);
    const base = groundY;
    const hp = side === 'p' ? pCastle : eCastle;
    const skin = side === 'p' ? CASTLE_SKIN.player : CASTLE_SKIN.enemy;
    const img = side === 'p' ? castleImgP : castleImgE;
    const drawH = Math.min(96, Math.max(70, H * 0.22));
    const drawW = drawH;

    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, x - drawW / 2, base - drawH, drawW, drawH);
    } else {
      const col = skin.color;
      const w = 50;
      const h = 70;
      ctx.fillStyle = col;
      ctx.fillRect(x - w / 2, base - h, w, h);
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(x - w / 2 + i * 18, base - h - 12, 12, 12);
      }
      ctx.fillStyle = '#3e2723';
      ctx.fillRect(x - 10, base - 28, 20, 28);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, base - h - 12);
      ctx.lineTo(x, base - h - 36);
      ctx.stroke();
      ctx.fillStyle = skin.flag;
      ctx.beginPath();
      ctx.moveTo(x, base - h - 36);
      ctx.lineTo(x + (side === 'p' ? 16 : -16), base - h - 28);
      ctx.lineTo(x, base - h - 20);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 3;
    const label = String(Math.ceil(hp));
    ctx.strokeText(label, x, base - drawH - 8);
    ctx.fillText(label, x, base - drawH - 8);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = '#7ec8e3';
    ctx.fillRect(0, 0, W, groundY);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    [[W * 0.2, 40], [W * 0.55, 28], [W * 0.8, 50]].forEach(function (c) {
      ctx.beginPath();
      ctx.arc(c[0], c[1], 18, 0, Math.PI * 2);
      ctx.arc(c[0] + 16, c[1] + 2, 14, 0, Math.PI * 2);
      ctx.arc(c[0] - 14, c[1] + 4, 12, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = '#6bbf5a';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#5aad4a';
    ctx.fillRect(0, groundY, W, 8);

    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(castleX('p') + 40, groundY - 2);
    ctx.lineTo(castleX('e') - 40, groundY - 2);
    ctx.stroke();
    ctx.setLineDash([]);

    drawCastle('p');
    drawCastle('e');

    units.slice().sort(function (a, b) { return a.x - b.x; }).forEach(drawStick);

    projectiles.forEach(function (p) {
      ctx.fillStyle = '#5d4037';
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.vx > 0 ? 0 : Math.PI);
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(-4, -3);
      ctx.lineTo(-4, 3);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    fx.forEach(function (f) {
      const t = Math.max(0, f.life / 0.35);
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,180,40,' + (0.55 * t) + ')';
      ctx.arc(f.x, f.y, f.r * (1.1 - t * 0.3), 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,' + (0.7 * t) + ')';
      ctx.arc(f.x, f.y, f.r * 0.35 * t, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.font = 'bold 13px "PingFang TC","Noto Sans TC",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('城堡', castleX('p'), groundY + 22);
    ctx.fillText('城堡', castleX('e'), groundY + 22);
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05;

    if (running) {
      gameTime += dt;
      goldAcc += goldRate() * dt;
      if (goldAcc >= 1) {
        gold += Math.floor(goldAcc);
        goldAcc -= Math.floor(goldAcc);
        updateHud();
      }
      spawnCd = Math.max(0, spawnCd - dt);
      enemyAi(dt);
      updateUnits(dt);
      updateProjectiles(dt);
      updateFx(dt);
      checkEnd();
      updateButtons();
    } else {
      updateFx(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
